name: Build and Deploy
on:
  push:
      branches:
        - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TERM: xterm
      TZ: Europe/Berlin
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore Timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Set up Node 🟢
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies 🛠️
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip libjpeg-dev libwebp-dev
          pip3 install -r requirements.txt

      - name: Install and Build 🔧
        run: |
          wget -O pandoc.deb https://github.com/jgm/pandoc/releases/download/2.13/pandoc-2.13-1-amd64.deb
          sudo dpkg -i pandoc.deb
          python3 build.py

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # The branch the action should deploy to. Has to be specified in the repo's settings.
          folder: _site     # The folder the action should deploy from.
